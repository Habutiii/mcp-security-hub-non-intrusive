name: AGW CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  secrets:
    name: Secret detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan git history and workspace
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test-and-build:
    name: Pytest, build, and image scan
    runs-on: ubuntu-latest
    env:
      AGW_ALLOWED_TARGETS: example.com
      IMAGE: security-hub-agw:ci
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r gateway-mcp/requirements.txt
          python -m pip install -r tools/fuzzing/boofuzz-mcp/requirements.txt
          python -m pip install pytest pytest-asyncio

      - name: Run pytest
        run: pytest tests/ -v --tb=short

      - name: Validate Compose
        run: docker compose config --quiet

      - name: Build the AGW image
        run: docker build --pull --tag "$IMAGE" .

      - name: Scan image for high and critical vulnerabilities
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: ${{ env.IMAGE }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: HIGH,CRITICAL

      - name: Export vulnerability report
        if: always()
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: ${{ env.IMAGE }}
          format: sarif
          output: trivy-agw.sarif
          ignore-unfixed: true
          severity: HIGH,CRITICAL

      - name: Upload vulnerability report
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-agw.sarif
          category: agw-image
