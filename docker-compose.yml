    container_name: masscan-mcp
    environment:
      - MASSCAN_OUTPUT_DIR=/app/output
      - MASSCAN_TIMEOUT=${MASSCAN_TIMEOUT:-300}
      - MASSCAN_MAX_RATE=${MASSCAN_MAX_RATE:-10000}
    volumes:
      - masscan-output:/app/output
    ports:
      - "3017:3000"
    networks:
      - mcp-network
