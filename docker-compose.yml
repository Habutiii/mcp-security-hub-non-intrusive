      - nuclei-templates:/app/templates
      - nuclei-output:/app/output
    ports:
      - "3003:3000"
    networks:
      - mcp-network
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  sqlmap-mcp:
