      - boofuzz-results:/app/results
    ports:
      - "3029:3000"
    networks:
      - mcp-network
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  # ===========================================================================
  # Secrets Detection
  # ===========================================================================
  gitleaks-mcp:
    build:
      context: ./secrets/gitleaks-mcp
      dockerfile: Dockerfile
    image: gitleaks-mcp:latest
    container_name: gitleaks-mcp
