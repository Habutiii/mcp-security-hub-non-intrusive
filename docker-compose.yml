# Offensive Security MCP Servers - Docker Compose
#
# Usage:
#   docker-compose up -d                    # Start all services
#   docker-compose up nuclei-mcp -d         # Start specific service
#   docker-compose logs -f nuclei-mcp       # View logs
#   docker-compose down                     # Stop all services
#
# Security Notes:
#   - All containers run as non-root (uid 1000)
#   - Network isolation via dedicated bridge network
#   - Read-only filesystems where possible
#   - Capabilities dropped by default

version: '3.8'

services:
  # ===========================================================================
  # Reconnaissance
  # ===========================================================================
  nmap-mcp:
    build:
      context: ./reconnaissance/nmap-mcp
      dockerfile: Dockerfile
    image: nmap-mcp:latest
    container_name: nmap-mcp
    ports:
      - "3001:3000"
    networks:
      - mcp-network
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_RAW # Required for raw socket scanning
      - NET_ADMIN # Required for some scan types
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M

  shodan-mcp:
    build:
      context: ./reconnaissance/shodan-mcp
      dockerfile: Dockerfile
    image: shodan-mcp:latest
    container_name: shodan-mcp
    environment:
      - SHODAN_API_KEY=${SHODAN_API_KEY:-}
    ports:
      - "3002:3000"
    networks:
      - mcp-network
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=64M
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  pd-tools-mcp:
    build:
      context: ./reconnaissance/pd-tools-mcp
      dockerfile: Dockerfile
    image: pd-tools-mcp:latest
    container_name: pd-tools-mcp
    ports:
      - "3009:3000"
    networks:
      - mcp-network
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  whatweb-mcp:
    build:
      context: ./reconnaissance/whatweb-mcp
      dockerfile: Dockerfile
    image: whatweb-mcp:latest
    container_name: whatweb-mcp
