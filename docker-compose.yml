    image: nikto-mcp:latest
    container_name: nikto-mcp
    environment:
      - NIKTO_OUTPUT_DIR=/app/output
      - NIKTO_TIMEOUT=${NIKTO_TIMEOUT:-600}
    volumes:
      - nikto-output:/app/output
    ports:
      - "3010:3000"
    networks:
      - mcp-network
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
