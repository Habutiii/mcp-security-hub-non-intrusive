      context: ./web-security/burp-mcp
      dockerfile: Dockerfile
    image: burp-mcp:latest
    container_name: burp-mcp
    ports:
      - "3031:3000"
    networks:
      - mcp-network
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M

  # ===========================================================================
  # OSINT
  # ===========================================================================
  maigret-mcp:
    build:
      context: ./osint/maigret-mcp
      dockerfile: Dockerfile
    image: maigret-mcp:latest
    container_name: maigret-mcp
    ports:
      - "3033:3000"
    networks:
      - mcp-network
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M

  dnstwist-mcp:
    build:
      context: ./osint/dnstwist-mcp
      dockerfile: Dockerfile
    image: dnstwist-mcp:latest
    container_name: dnstwist-mcp
    ports:
      - "3034:3000"
    networks:
      - mcp-network
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M

  # ===========================================================================
  # Threat Intelligence (additional)
  # ===========================================================================
  virustotal-mcp:
    build:
      context: ./threat-intel/virustotal-mcp
      dockerfile: Dockerfile
    image: virustotal-mcp:latest
    container_name: virustotal-mcp
    environment:
      - VIRUSTOTAL_API_KEY=${VIRUSTOTAL_API_KEY:-}
    ports:
      - "3035:3000"
    networks:
      - mcp-network
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # ===========================================================================
  # Active Directory
  # ===========================================================================
  bloodhound-mcp:
    build:
      context: ./active-directory/bloodhound-mcp
      dockerfile: Dockerfile
    image: bloodhound-mcp:latest
    container_name: bloodhound-mcp
    ports:
      - "3036:3000"
    networks:
      - mcp-network
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G

  # ===========================================================================
  # Password Cracking
  # ===========================================================================
  hashcat-mcp:
    build:
      context: ./password-cracking/hashcat-mcp
      dockerfile: Dockerfile
    image: hashcat-mcp:latest
    container_name: hashcat-mcp
    volumes:
      - hashcat-wordlists:/app/wordlists
    ports:
      - "3037:3000"
    networks:
      - mcp-network
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G

# =============================================================================
# Networks
# =============================================================================
networks:
  mcp-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
    driver_opts:
      com.docker.network.bridge.enable_icc: "true"
      com.docker.network.bridge.enable_ip_masquerade: "true"

# =============================================================================
# Volumes
# =============================================================================
volumes:
  # Nuclei
  nuclei-templates:
    driver: local
  nuclei-output:
    driver: local

  # SQLMap
  sqlmap-output:
    driver: local

  # Nikto
  nikto-output:
    driver: local

  # ffuf
  ffuf-output:
    driver: local
  ffuf-wordlists:
    driver: local

  # Hashcat (runtime-downloaded SecLists dictionary)
  hashcat-wordlists:
    driver: local

  # WhatWeb
  whatweb-output:
    driver: local

  # Masscan
  masscan-output:
    driver: local

  # Waybackurls
  waybackurls-output:
    driver: local

  # Gitleaks
  gitleaks-output:
    driver: local

  # Dharma
  dharma-grammars:
    driver: local
  dharma-output:
    driver: local

  # Boofuzz
  boofuzz-scripts:
    driver: local
  boofuzz-results:
    driver: local
