services:
  security-hub-agw:
    build:
      context: .
      dockerfile: Dockerfile
    image: security-hub-agw:latest
    stdin_open: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Do not add capabilities by default. If an authorized deployment needs
    # Nmap raw-socket scans, add only NET_RAW after setting target scope.
    # cap_add: [NET_RAW]
    read_only: true
    tmpfs:
      - /tmp:size=128M
      - /var/lib/security-hub:size=512M
    environment:
      AGW_ALLOWED_TARGETS: ${AGW_ALLOWED_TARGETS:?set explicit authorized domains/CIDRs}
      # Zero keeps initialized tool MCP processes for the whole AGW session.
      AGW_IDLE_TIMEOUT_SECONDS: ${AGW_IDLE_TIMEOUT_SECONDS:-0}
      # Zero is unlimited: retain every initialized reviewed tool for the
      # gateway session. Set a positive value only to opt into LRU reaping.
      AGW_MAX_WARM_PROCESSES: ${AGW_MAX_WARM_PROCESSES:-0}
      AGW_RAW_NETWORK_ENABLED: ${AGW_RAW_NETWORK_ENABLED:-false}
