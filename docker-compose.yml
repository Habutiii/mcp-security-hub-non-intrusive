      resources:
        limits:
          cpus: '2'
          memory: 1G

  zoomeye-mcp:
    build:
      context: ./reconnaissance/zoomeye-mcp
      dockerfile: Dockerfile
    image: zoomeye-mcp:latest
    container_name: zoomeye-mcp
    environment:
      - ZOOMEYE_API_KEY=${ZOOMEYE_API_KEY:-}
    ports:
      - "3024:3000"
    networks:
      - mcp-network
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
