      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # ===========================================================================
  # Additional Reconnaissance
  # ===========================================================================
  networksdb-mcp:
    build:
      context: ./reconnaissance/networksdb-mcp
      dockerfile: Dockerfile
    image: networksdb-mcp:latest
    container_name: networksdb-mcp
    environment:
      - NETWORKSDB_API_KEY=${NETWORKSDB_API_KEY:-}
    ports:
